global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'cnip'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'cnip-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'

  - job_name: 'cnip-neo4j'
    static_configs:
      - targets: ['neo4j:7474']
    metrics_path: '/metrics'

  - job_name: 'cnip-redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'cnip-celery'
    static_configs:
      - targets: ['celery-worker:5555', 'celery-beat:5555']
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']